services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./scripts/docker-mongo-init.sh:/docker-mongo-init.sh:ro
    entrypoint: ["/bin/bash", "/docker-mongo-init.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: mongodb://mongo:27017/widamine?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Widamine}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    ports:
      - "${API_PORT:-3000}:3000"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8080}:80"
    labels:
      - "coolify.managed=true"

  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
      args:
        VITE_PUBLIC_API_URL: /api
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${LANDING_PORT:-8081}:80"

volumes:
  mongo_data:
