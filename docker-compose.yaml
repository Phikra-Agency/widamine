services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Widamine}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    expose:
      - "3000"
    labels:
      - "coolify.managed=true"
      - "coolify.name=api"
      - "coolify.type=service"
      - "traefik.enable=true"
      - "traefik.http.routers.api-tyfa0ow9za5ohqn69dh9zhh4.rule=Host(`api.widamineaestheticcenter.com`)"
      - "traefik.http.routers.api-tyfa0ow9za5ohqn69dh9zhh4.entrypoints=https"
      - "traefik.http.routers.api-tyfa0ow9za5ohqn69dh9zhh4.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-tyfa0ow9za5ohqn69dh9zhh4.loadbalancer.server.port=3000"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:-https://api.widamineaestheticcenter.com}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    labels:
      - "coolify.managed=true"
      - "coolify.name=admin"
      - "coolify.type=service"
      - "traefik.enable=true"
      - "traefik.http.routers.admin-tyfa0ow9za5ohqn69dh9zhh4.rule=Host(`new.widamineaestheticcenter.com`)"
      - "traefik.http.routers.admin-tyfa0ow9za5ohqn69dh9zhh4.entrypoints=https"
      - "traefik.http.routers.admin-tyfa0ow9za5ohqn69dh9zhh4.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin-tyfa0ow9za5ohqn69dh9zhh4.loadbalancer.server.port=80"

  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
      args:
        VITE_PUBLIC_API_URL: /api
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    labels:
      - "coolify.managed=true"
      - "coolify.fqdn=https://widamineaestheticcenter.com"
