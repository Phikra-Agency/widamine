services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Widamine}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    ports:
      - "${API_PORT:-3000}:3000"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:-https://api.widamineaestheticcenter.com}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8080}:80"
    labels:
      - "coolify.managed=true"
      - "coolify.fqdn=https://new.widamineaestheticcenter.com"

  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
      args:
        VITE_PUBLIC_API_URL: /api
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${LANDING_PORT:-8081}:80"
