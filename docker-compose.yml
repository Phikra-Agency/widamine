services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Widamine}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
    ports:
      - "${API_PORT:-3000}:3000"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
      args:
        VITE_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-8080}:80"

  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
      args:
        VITE_PUBLIC_API_URL: /api
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${LANDING_PORT:-8081}:80"
