server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  # Cache static assets — images 1yr, js/css 1yr, html no-cache
  location ~* \.(webp|avif|jpg|jpeg|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
